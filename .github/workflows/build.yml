name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip & Prepare Project
        run: |
          echo "=== 1. 解压项目 ==="
          mkdir -p build_src
          unzip -o *.zip -d build_src/ || true
          
          PKG_PATH=$(find build_src -name "Package.swift" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "错误: 未找到 Package.swift"
            exit 1
          fi
          
          # 1. 修复 Package.swift
          sed -i '' 's/26\.0/16\.0/g' "$PKG_PATH"
          sed -i '' 's/"26\.0"/"16\.0"/g' "$PKG_PATH"
          sed -i '' '/BareSlashRegexLiterals/d' "$PKG_PATH"
          
          # 2. 重命名目录
          PKG_DIR=$(dirname "$PKG_PATH")
          SWIFTPM_DIR="$GITHUB_WORKSPACE/App.swiftpm"
          rm -rf "$SWIFTPM_DIR"
          mv "$PKG_DIR" "$SWIFTPM_DIR"
          
          # 3. 修补 Swift 多线程语法
          echo "=== 2. 修补 Swift 多线程语法 ==="
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/final class LocalImageStore/final class LocalImageStore: @unchecked Sendable/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class AutoTranslationManager: ObservableObject/class AutoTranslationManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class PhotoWidgetManager: ObservableObject/class PhotoWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class InsPostWidgetManager: ObservableObject/class InsPostWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class KoreanMessageWidgetManager: ObservableObject/class KoreanMessageWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class ChatBubbleWidgetManager: ObservableObject/class ChatBubbleWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          
          echo "SWIFTPM_DIR=$SWIFTPM_DIR" >> $GITHUB_ENV

      - name: Build App with Xcode
        run: |
          cd "$SWIFTPM_DIR"
          
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          
          SCHEME=$(xcodebuild -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | sed -e 's/^[[:space:]]*//' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="AppModule"
          fi
          echo "目标 Scheme: $SCHEME"

          rm -rf /tmp/derived_data
          echo "=== 3. 开始编译 ==="
          xcodebuild -destination 'generic/platform=iOS' \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -derivedDataPath /tmp/derived_data \
                     PRODUCT_BUNDLE_IDENTIFIER="com.youdao.app" \
                     ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     OTHER_SWIFT_FLAGS="-strict-concurrency=minimal" \
                     2>&1 | tee build.log || {
                       echo "================ 编译错误日志 ================"
                       grep -i -C 3 "error:" build.log || tail -n 50 build.log
                       exit 1
                     }

      - name: Package Clean IPA for ESign
        run: |
          echo "=== 4. 识别二进制文件并精确修复 Info.plist ==="
          APP_PATH=$(find /tmp/derived_data/Build/Products/ -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /tmp/derived_data -name "*.app" | grep -v "Intermediates" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "错误: 未找到编译出的 .app 文件"
            exit 1
          fi
          echo "发现应用包路径: $APP_PATH"

          rm -rf Payload "$GITHUB_WORKSPACE/Youdao_Unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app

          # 清理干扰文件
          rm -rf Payload/App.app/Frameworks
          rm -rf Payload/App.app/_CodeSignature
          rm -f Payload/App.app/embedded.mobileprovision

          # 使用 macOS file 指令精准识别真正的 Mach-O 64-bit 机器码（绝不会误判 PkgInfo）
          EXEC_FILE=$(file Payload/App.app/* | grep "Mach-O" | head -n 1 | cut -d: -f1)
          if [ -n "$EXEC_FILE" ]; then
            EXEC_NAME=$(basename "$EXEC_FILE")
          else
            EXEC_NAME="AppModule"
          fi
          echo "辨识出的真实 Mach-O 主程序: $EXEC_NAME"

          # 使用原生 plutil 精准注入全能签读取所需的所有卡片信息
          INFO_PLIST="Payload/App.app/Info.plist"
          
          plutil -replace CFBundleExecutable -string "$EXEC_NAME" "$INFO_PLIST" || plutil -insert CFBundleExecutable -string "$EXEC_NAME" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.youdao.app" "$INFO_PLIST" || plutil -insert CFBundleIdentifier -string "com.youdao.app" "$INFO_PLIST"
          plutil -replace CFBundleName -string "Youdao" "$INFO_PLIST" || plutil -insert CFBundleName -string "Youdao" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "幼刀" "$INFO_PLIST" || plutil -insert CFBundleDisplayName -string "幼刀" "$INFO_PLIST"
          plutil -replace CFBundlePackageType -string "APPL" "$INFO_PLIST" || plutil -insert CFBundlePackageType -string "APPL" "$INFO_PLIST"
          plutil -replace CFBundleShortVersionString -string "1.0.0" "$INFO_PLIST" || plutil -insert CFBundleShortVersionString -string "1.0.0" "$INFO_PLIST"
          plutil -replace CFBundleVersion -string "1.0.0" "$INFO_PLIST" || plutil -insert CFBundleVersion -string "1.0.0" "$INFO_PLIST"
          plutil -replace MinimumOSVersion -string "16.0" "$INFO_PLIST" || plutil -insert MinimumOSVersion -string "16.0" "$INFO_PLIST"
          plutil -replace LSRequiresIPhoneOS -bool true "$INFO_PLIST" || plutil -insert LSRequiresIPhoneOS -bool true "$INFO_PLIST"

          # 转为原生二进制 binary1 格式
          plutil -convert binary1 "$INFO_PLIST"

          # 清理垃圾隐藏文件
          export COPYFILE_DISABLE=1
          export COPY_EXTENDED_ATTRIBUTES_DISABLE=1
          find Payload -name "._*" -delete
          find Payload -name ".DS_Store" -delete
          rm -rf Payload/__MACOSX

          chmod -R 755 Payload/
          chmod +x Payload/App.app/*

          # 打包纯净 IPA
          zip -qr -y -X "$GITHUB_WORKSPACE/Youdao_Unsigned.ipa" Payload -x "*.DS_Store" -x "*/._*"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youdao_iOS_App
          path: Youdao_Unsigned.ipa
