name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip & Prepare Project
        run: |
          echo "=== 1. 解压文件 ==="
          mkdir -p build_src
          unzip -o *.zip -d build_src/ || true
          
          # 找到 Package.swift 文件
          PKG_PATH=$(find build_src -name "Package.swift" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "错误: 未找到 Package.swift"
            exit 1
          fi
          
          # 将 iOS 26.0 修改为 16.0
          sed -i '' 's/26\.0/16\.0/g' "$PKG_PATH"
          sed -i '' 's/"26\.0"/"16\.0"/g' "$PKG_PATH"
          
          # 强制重命名为标准的 App.swiftpm 目录
          PKG_DIR=$(dirname "$PKG_PATH")
          SWIFTPM_DIR="$GITHUB_WORKSPACE/App.swiftpm"
          rm -rf "$SWIFTPM_DIR"
          mv "$PKG_DIR" "$SWIFTPM_DIR"
          
          echo "SWIFTPM_DIR=$SWIFTPM_DIR" >> $GITHUB_ENV

      - name: Build App with Xcode
        run: |
          cd "$SWIFTPM_DIR"
          
          # 设置 UTF-8 语言环境支持中文 Scheme
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          
          echo "=== 2. 自动匹配 Scheme ==="
          xcodebuild -list || true
          
          SCHEME=$(xcodebuild -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | sed -e 's/^[[:space:]]*//' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="AppModule"
          fi
          echo "找到的目标 Scheme: $SCHEME"

          echo "=== 3. 开始编译 ==="
          xcodebuild -destination 'generic/platform=iOS' \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -derivedDataPath derived_data \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

          echo "=== 4. 打包 IPA ==="
          mkdir -p Payload
          APP_PATH=$(find derived_data -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误: 未找到编译出的 .app 文件"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/Youdao_Unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youdao_iOS_App
          path: Youdao_Unsigned.ipa
