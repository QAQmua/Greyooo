name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip & Prepare Project
        run: |
          echo "=== 1. 解压项目 ==="
          mkdir -p build_src
          unzip -o *.zip -d build_src/ || true
          
          PKG_PATH=$(find build_src -name "Package.swift" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "错误: 未找到 Package.swift"
            exit 1
          fi
          
          # 1. 修复 Package.swift
          sed -i '' 's/26\.0/16\.0/g' "$PKG_PATH"
          sed -i '' 's/"26\.0"/"16\.0"/g' "$PKG_PATH"
          sed -i '' '/BareSlashRegexLiterals/d' "$PKG_PATH"
          
          # 2. 重命名为 App.swiftpm 目录
          PKG_DIR=$(dirname "$PKG_PATH")
          SWIFTPM_DIR="$GITHUB_WORKSPACE/App.swiftpm"
          rm -rf "$SWIFTPM_DIR"
          mv "$PKG_DIR" "$SWIFTPM_DIR"
          
          # 3. 修补 Swift 多线程语法
          echo "=== 2. 修补 Swift 多线程语法 ==="
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/final class LocalImageStore/final class LocalImageStore: @unchecked Sendable/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class AutoTranslationManager: ObservableObject/class AutoTranslationManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class PhotoWidgetManager: ObservableObject/class PhotoWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class InsPostWidgetManager: ObservableObject/class InsPostWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class KoreanMessageWidgetManager: ObservableObject/class KoreanMessageWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          find "$SWIFTPM_DIR" -name "*.swift" -exec sed -i '' 's/class ChatBubbleWidgetManager: ObservableObject/class ChatBubbleWidgetManager: @unchecked Sendable, ObservableObject/g' {} +
          
          echo "SWIFTPM_DIR=$SWIFTPM_DIR" >> $GITHUB_ENV

      - name: Build App with Xcode
        run: |
          cd "$SWIFTPM_DIR"
          
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          
          SCHEME=$(xcodebuild -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | sed -e 's/^[[:space:]]*//' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="AppModule"
          fi
          echo "目标 Scheme: $SCHEME"

          rm -rf /tmp/derived_data
          echo "=== 3. 开始编译 ==="
          xcodebuild -destination 'generic/platform=iOS' \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -derivedDataPath /tmp/derived_data \
                     PRODUCT_BUNDLE_IDENTIFIER="com.youdao.app" \
                     ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     OTHER_SWIFT_FLAGS="-strict-concurrency=minimal" \
                     2>&1 | tee build.log || {
                       echo "================ 编译错误日志 ================"
                       grep -i -C 3 "error:" build.log || tail -n 50 build.log
                       exit 1
                     }

      - name: Package Clean IPA for ESign
        run: |
          echo "=== 4. 清理残留签名并组装纯净 Payload（防全能签签名闪退） ==="
          APP_PATH=$(find /tmp/derived_data/Build/Products/ -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /tmp/derived_data -name "*.app" | grep -v "Intermediates" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "错误: 未找到编译出的 .app 文件"
            exit 1
          fi
          echo "发现应用包路径: $APP_PATH"

          # 彻底重新构建 Payload/App.app 目录结构，绝不产生双层嵌套
          rm -rf Payload "$GITHUB_WORKSPACE/Youdao_Unsigned.ipa"
          mkdir -p Payload/App.app

          # 只拷贝文件夹内部的所有具体文件，防止嵌套
          cp -R "$APP_PATH/"* Payload/App.app/

          # 用 Python 清洗残留签名、调试文件并修复 Info.plist
          python3 - << 'EOF'
          import os, shutil, plistlib

          app_path = "Payload/App.app"

          # 1. 彻底清空旧签名文件夹（解决全能签重签名引擎闪退的核心）
          code_sig = os.path.join(app_path, "_CodeSignature")
          if os.path.exists(code_sig):
              shutil.rmtree(code_sig)

          provision = os.path.join(app_path, "embedded.mobileprovision")
          if os.path.exists(provision):
              os.remove(provision)

          # 2. 扫尾：删除任何嵌套的 .app 或 .dSYM 调试文件
          for item in os.listdir(app_path):
              item_path = os.path.join(app_path, item)
              if item.endswith(".dSYM") or (item.endswith(".app") and os.path.isdir(item_path)):
                  if os.path.isdir(item_path):
                      shutil.rmtree(item_path)
                  else:
                      os.remove(item_path)

          # 3. 补全 Info.plist 关键信息
          info_plist_path = os.path.join(app_path, "Info.plist")
          exec_name = None
          for f in os.listdir(app_path):
              fp = os.path.join(app_path, f)
              if os.path.isfile(fp) and not f.startswith(".") and not f.endswith(".plist") and not f.endswith(".json") and not f.endswith(".nib") and not os.path.isdir(fp):
                  exec_name = f
                  break

          if not exec_name:
              exec_name = "AppModule"

          try:
              with open(info_plist_path, "rb") as f:
                  plist = plistlib.load(f)
          except Exception:
              plist = {}

          plist["CFBundleIdentifier"] = "com.youdao.app"
          plist["CFBundleName"] = "Youdao"
          plist["CFBundleDisplayName"] = "幼刀"
          plist["CFBundleExecutable"] = exec_name
          plist["CFBundlePackageType"] = "APPL"
          plist["CFBundleShortVersionString"] = "1.0"
          plist["CFBundleVersion"] = "1"
          plist["MinimumOSVersion"] = "16.0"
          plist["CFBundleSupportedPlatforms"] = ["iPhoneOS"]
          plist["UIDeviceFamily"] = [1, 2]
          plist["UILaunchScreen"] = {}
          plist["UIApplicationSceneManifest"] = {
              "UIApplicationSupportsMultipleScenes": True,
              "UISceneConfigurations": {}
          }

          with open(info_plist_path, "wb") as f:
              plistlib.dump(plist, f)

          print(f"清洗成功，主执行文件名: {exec_name}")
          EOF

          # 清理苹果属性垃圾文件
          export COPYFILE_DISABLE=1
          export COPY_EXTENDED_ATTRIBUTES_DISABLE=1
          find Payload -name "._*" -delete
          find Payload -name ".DS_Store" -delete
          rm -rf Payload/__MACOSX

          chmod -R 755 Payload/
          chmod +x Payload/App.app/*

          # 压成纯净 IPA
          zip -qr -y -X "$GITHUB_WORKSPACE/Youdao_Unsigned.ipa" Payload -x "*.DS_Store" -x "*/._*"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youdao_iOS_App
          path: Youdao_Unsigned.ipa
